services:
  app:
    build: .
    ports:
      - "8080:8000"   # aplikacja webowa
      - "7900:7900"   # podgląd przeglądarki (noVNC)
    environment:
      BASE_URL:        ${BASE_URL:-http://localhost}
      PANEL_USER:      ${PANEL_USER:-admin}
      PANEL_PASSWORD:  ${PANEL_PASSWORD:-admin123}
      DISPLAY:         ":99"
    volumes:
      - ./tests:/app/tests
    healthcheck:
      test: ["CMD", "php", "-r", "exit(file_get_contents('http://localhost:8000/api/tests') ? 0 : 1);"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
